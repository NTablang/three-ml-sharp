<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#050508" />
		<meta name="description" content="Turn a photograph into a living, audio-reactive particle memory." />
		<title>Memory Field</title>
	</head>
	<body>
		<main id="app" aria-label="Interactive particle memory"></main>

		<header class="topbar">
			<div id="privacy-pill" class="privacy-pill"><span></span>Images stay on this device</div>
		</header>

		<section class="intro" aria-labelledby="intro-title">
			<p class="eyebrow">A living photograph</p>
			<h1 id="intro-title">Step inside<br />a memory.</h1>
			<p class="lede">Choose a photograph. Local AI gives it depth; light, sound, and your hands bring it to life.</p>
			<button id="upload-hero" class="hero-button" type="button"><span>Choose a photograph</span><span aria-hidden="true">↗</span></button>
		</section>

		<section class="control-shell" aria-label="Memory controls">
			<button id="controls-toggle" class="controls-toggle" type="button" aria-expanded="false" aria-controls="memory-controls" aria-label="Open memory controls">
				<span class="toggle-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
				<span class="toggle-label">Controls</span>
			</button>
			<div id="memory-controls" class="control-panel" aria-hidden="true" inert>
				<div class="control-group primary-actions">
					<button id="upload-btn" class="control-button" type="button" data-tooltip="New photograph"><span class="button-icon" aria-hidden="true">＋</span><span>Photo</span></button>
					<button id="audio-btn" class="control-button" type="button" data-tooltip="Add a soundtrack"><span class="button-icon audio-icon" aria-hidden="true">♪</span><span>Sound</span></button>
					<button id="hand-btn" class="control-button" type="button" data-tooltip="Control with your hand"><span class="button-icon" aria-hidden="true">◌</span><span>Hand</span></button>
				</div>
				<div class="divider" aria-hidden="true"></div>
				<div class="preset-group" aria-label="Atmosphere presets">
					<span class="preset-label">Atmosphere</span>
					<div class="preset-buttons">
						<button class="preset active" data-preset="dream" type="button">Dream</button>
						<button class="preset" data-preset="storm" type="button">Storm</button>
						<button class="preset" data-preset="still" type="button">Still</button>
					</div>
				</div>
				<div class="divider" aria-hidden="true"></div>
				<div class="secondary-actions">
					<button id="reconstruct-btn" class="round-button" type="button" aria-label="Reconstruct memory" data-tooltip="Reconstruct">↻</button>
					<button id="settings-btn" class="round-button" type="button" aria-label="Open fine tuning" data-tooltip="Fine tune">
						<svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.03-1.56V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.03H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
					</button>
				</div>
			</div>
		</section>

		<div class="audio-dock">
			<div id="audio-meter" class="audio-meter" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
			<audio id="audio-player" controls hidden></audio>
		</div>

		<div id="hand-preview" class="hand-preview" hidden>
			<video id="hand-video" muted playsinline hidden></video>
			<div class="hand-preview-label"><span></span> Pinch to pull</div>
		</div>
		<div id="hand-cursor" class="hand-cursor" hidden></div>

		<div id="drop-zone" class="drop-zone" aria-hidden="true"><div><span>Drop to enter</span><small>JPG · PNG · WEBP</small></div></div>

		<div id="loader" class="loader" role="status" aria-live="polite">
			<div class="loader-orbit" aria-hidden="true"><i></i><i></i><i></i></div>
			<p id="loader-title">Opening memory</p>
			<span id="loader-detail">Preparing the particle field…</span>
			<div class="loader-track"><div id="loader-bar"></div></div>
		</div>

		<div id="toast" class="toast" role="status" aria-live="polite"></div>
		<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
		<input id="audio-input" type="file" accept="audio/*" hidden />
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
